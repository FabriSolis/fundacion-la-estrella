name: Build and deploy Node.js app to Azure Web App - fundacion-la-estrella-api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Build backend
        working-directory: ./backend
        run: npm run build --if-present

      - name: Create deployment package
        working-directory: ./backend
        run: zip -r -y ../backend.zip . -x ".env" ".env.*" "*/.env" "*/.env.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_39348BDD4D044937B1330F3A9E338CB3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5C6DE325C22B4EC6818890BEC044C3EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA3EE95EF9B449C7B5F0B40D07136AD1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fundacion-la-estrella-api'
          slot-name: 'Production'
          package: backend.zip
